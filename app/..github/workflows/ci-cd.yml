name: Full CI/CD Pipeline (Feature → Staging → Production)

on:
  push:
    branches:
      - 'feature/*'
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # --------------------------
  # 1️⃣ CI - Build & Test
  # --------------------------
  ci:
    name: CI - Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prisma Generate
        run: npx prisma generate

      - name: Prisma Migration Status
        run: npx prisma migrate status

      - name: Build App
        run: npm run build

  # --------------------------
  # 2️⃣ Feature Preview Deploy
  # --------------------------
  deploy_feature:
    name: Deploy Feature Preview
    runs-on: ubuntu-latest
    needs: ci
    if: startsWith(github.ref, 'refs/heads/feature/')

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install CLIs
        run: |
          npm install -g vercel@latest
          npm install -g neonctl

      - name: Link Vercel Project
        run: vercel link --yes --project $VERCEL_PROJECT_ID --token=$VERCEL_TOKEN

      - name: Pull Vercel Preview Env
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Create Neon Branch
        env:
          NEON_ORG: ${{ secrets.NEON_ORG }}
          NEON_PROJECT: ${{ secrets.NEON_PROJECT }}
          NEON_ADMIN_KEY: ${{ secrets.NEON_ADMIN_KEY }}
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')

          neon branch create $BRANCH_NAME \
            --parent main \
            --project $NEON_PROJECT \
            --org $NEON_ORG \
            --auth $NEON_ADMIN_KEY || true

          DB_URL=$(neon connection-url $BRANCH_NAME \
            --project $NEON_PROJECT \
            --org $NEON_ORG \
            --auth $NEON_ADMIN_KEY)

          echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy

      - name: Build Project
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy Preview
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN --confirm

  # --------------------------
  # 3️⃣ Staging Deploy
  # --------------------------
  deploy_staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/staging'

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel Project
        run: vercel link --yes --project $VERCEL_PROJECT_ID --token=$VERCEL_TOKEN

      - name: Pull Staging Env
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Build Project
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy Staging
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN --confirm

  # --------------------------
  # 4️⃣ Production Deploy
  # --------------------------
  deploy_production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel Project
        run: vercel link --yes --project $VERCEL_PROJECT_ID --token=$VERCEL_TOKEN

      - name: Pull Production Env
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Build Project
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy Production
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --confirm

  # --------------------------
  # 5️⃣ Cleanup Feature DB
  # --------------------------
  cleanup:
    name: Cleanup Feature DB
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feature/')

    steps:
      - name: Install Neon CLI
        run: npm install -g neonctl

      - name: Delete Neon Branch
        env:
          NEON_ORG: ${{ secrets.NEON_ORG }}
          NEON_PROJECT: ${{ secrets.NEON_PROJECT }}
          NEON_ADMIN_KEY: ${{ secrets.NEON_ADMIN_KEY }}
        run: |
          BRANCH_NAME=$(echo "${{ github.event.pull_request.head.ref }}" | tr '/' '-')

          neon branch delete $BRANCH_NAME \
            --project $NEON_PROJECT \
            --org $NEON_ORG \
            --auth $NEON_ADMIN_KEY \
            --force