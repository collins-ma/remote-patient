name: Full CI/CD Pipeline (Feature → Staging → Production)

on:
  push:
    branches:
      - 'feature/*'
      - staging
      - main
  pull_request:
    branches:
      - 'feature/*'
      - staging
      - main

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # --------------------------
  # 1️⃣ CI - Build & Test
  # --------------------------
  ci:
    name: CI - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prisma Generate
        run: npx prisma generate

      - name: Prisma Migration Status
        run: npx prisma migrate status

      - name: Build App
        run: npm run build

  # --------------------------
  # 2️⃣ Feature Preview Deploy
  # --------------------------
  deploy_feature:
    name: Deploy Feature Preview
    runs-on: ubuntu-latest
    needs: ci
    if: startsWith(github.ref, 'refs/heads/feature/') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/'))

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Vercel CLI
        run: npm install -g vercel@canary

      - name: Pull Vercel Preview Environment Variables
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Create Neon Branch + DB
        env:
          NEON_ORG: ${{ secrets.NEON_ORG }}
          NEON_PROJECT: ${{ secrets.NEON_PROJECT }}
          NEON_ADMIN_KEY: ${{ secrets.NEON_ADMIN_KEY }}
        run: |
          BRANCH_NAME=$(echo "${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" | tr '/' '-')
          neon branch create $BRANCH_NAME \
            --parent main \
            --project $NEON_PROJECT \
            --org $NEON_ORG \
            --auth $NEON_ADMIN_KEY
          DB_URL=$(neon connection-url $BRANCH_NAME \
            --project $NEON_PROJECT \
            --org $NEON_ORG \
            --auth $NEON_ADMIN_KEY)
          echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy

      - name: Build Project Artifacts
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy Project Artifacts to Vercel Preview
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN --prod=false

  # --------------------------
  # 3️⃣ Staging Deploy
  # --------------------------
  deploy_staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/staging'

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Vercel CLI
        run: npm install -g vercel@canary

      - name: Pull Vercel Staging Environment
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Run Prisma Migrations (Staging DB)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Build Project Artifacts
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy Project Artifacts to Vercel Staging
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN --prod=false

  # --------------------------
  # 4️⃣ Production Deploy
  # --------------------------
  deploy_production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Vercel CLI
        run: npm install -g vercel@canary

      - name: Pull Vercel Production Environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Run Prisma Migrations (Production DB)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Build Project Artifacts
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy Project Artifacts to Vercel Production
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN --prod=true

  # --------------------------
  # 5️⃣ Cleanup Feature DB
  # --------------------------
  cleanup:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Install Neon CLI
        run: npm install -g neonctl
      - name: Delete Neon Branch
        env:
          NEON_ORG: ${{ secrets.NEON_ORG }}
          NEON_PROJECT: ${{ secrets.NEON_PROJECT }}
          NEON_ADMIN_KEY: ${{ secrets.NEON_ADMIN_KEY }}
        run: |
          BRANCH_NAME=$(echo "${{ github.event.pull_request.head.ref }}" | tr '/' '-')
          neon branch delete $BRANCH_NAME \
            --project $NEON_PROJECT \
            --org $NEON_ORG \
            --auth $NEON_ADMIN_KEY \
            --force