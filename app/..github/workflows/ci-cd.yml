name: PR CI/CD with Preview Deploy

on:
  pull_request:
    branches:
      - staging
      - main

  pull_request_target:
    types: [closed]

jobs:
  # --------------------------
  # 1️⃣ CI JOB (LIGHTWEIGHT)
  # --------------------------
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      # Install deps
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Prisma generate
      - name: Prisma Generate
        run: npx prisma generate

      # Check migration issues
      - name: Prisma Migration Status
        run: npx prisma migrate status

      # Build only
      - name: Build App
        run: npm run build

  # --------------------------
  # 2️⃣ PREVIEW DEPLOY
  # --------------------------
  deploy_preview:
    runs-on: ubuntu-latest
    needs: ci
    if: startsWith(github.head_ref, 'feature/')

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Neon CLI
        run: npm install -g neonctl

      - name: Setup Feature Database
        env:
          NEON_ORG: ${{ secrets.NEON_ORG }}
          NEON_PROJECT: ${{ secrets.NEON_PROJECT }}
          NEON_ADMIN_KEY: ${{ secrets.NEON_ADMIN_KEY }}
        run: |
          BRANCH_NAME=$(echo "${{ github.head_ref }}" | tr '/' '-')

          neon branch create $BRANCH_NAME \
            --parent main \
            --project $NEON_PROJECT \
            --org $NEON_ORG \
            --auth $NEON_ADMIN_KEY

          DB_URL=$(neon connection-url $BRANCH_NAME \
            --project $NEON_PROJECT \
            --org $NEON_ORG \
            --auth $NEON_ADMIN_KEY)

          echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV

      # SAFE even if no DB changes
      - name: Prisma Migrate Deploy
        run: npx prisma migrate deploy

      - name: Build App
        run: npm run build

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v21
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          prod: false

  # --------------------------
  # 3️⃣ CLEANUP
  # --------------------------
  cleanup:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Install Neon CLI
        run: npm install -g neonctl

      - name: Delete Feature DB
        env:
          NEON_ORG: ${{ secrets.NEON_ORG }}
          NEON_PROJECT: ${{ secrets.NEON_PROJECT }}
          NEON_ADMIN_KEY: ${{ secrets.NEON_ADMIN_KEY }}
        run: |
          BRANCH_NAME=$(echo "${{ github.event.pull_request.head.ref }}" | tr '/' '-')

          neon branch delete $BRANCH_NAME \
            --project $NEON_PROJECT \
            --org $NEON_ORG \
            --auth $NEON_ADMIN_KEY \
            --force